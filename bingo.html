<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>専用ビンゴカード</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20252b;
      --muted: #68717b;
      --paper: #f4efe7;
      --panel: #fffdf8;
      --line: #ddd4c8;
      --accent: #d85d43;
      --accent-dark: #a94232;
      --blue: #36788c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #fffdf7 0, var(--paper) 62%, #e7ddd0 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(760px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 40px 0;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-dark);
      font: 700 0.78rem/1.2 Arial, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 400;
      text-align: center;
    }

    .description, .status {
      color: var(--muted);
      font: 0.92rem/1.6 Arial, sans-serif;
      text-align: center;
    }

    .description { margin: 0 0 24px; }

    .card {
      width: min(100%, 560px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .number-box {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 28px rgba(66, 48, 31, 0.1);
      font-size: clamp(3rem, 12vw, 6rem);
    }

    .number-box.is-empty { color: #c8beb1; }
    .number-box.is-hit { border-color: var(--accent); background: #f9dfd6; color: var(--accent-dark); }
    .status { min-height: 24px; margin: 18px 0; }
    .status.error { color: var(--accent-dark); }
    .home-link { margin: 8px 0 24px; color: var(--blue); font: 700 0.95rem Arial, sans-serif; }

    .history {
      width: min(100%, 560px);
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font: 0.9rem/1.6 Arial, sans-serif;
    }

    .history h2 { margin: 0 0 8px; font-size: 1rem; }
    .history-list { margin: 0; padding-left: 1.5rem; }
    .history-empty { margin: 0; color: var(--muted); }

    @media (max-width: 560px) {
      .card { gap: 8px; }
      .number-box { border-radius: 5px; font-size: clamp(2.7rem, 17vw, 4.5rem); }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Personal Bingo Card</p>
    <h1>あなたのビンゴカード</h1>
    <p class="description">1〜20から選ばれた9個の数字です。同じブラウザでは同じカードが表示されます。</p>
    <section class="card" aria-label="ビンゴカード">
      <div class="number-box is-empty">-</div>
      <div class="number-box is-empty">-</div>
      <div class="number-box is-empty">-</div>
      <div class="number-box is-empty">-</div>
      <div class="number-box is-empty">-</div>
      <div class="number-box is-empty">-</div>
      <div class="number-box is-empty">-</div>
      <div class="number-box is-empty">-</div>
      <div class="number-box is-empty">-</div>
    </section>
    <p class="status" id="status" aria-live="polite">カードを読み込んでいます...</p>
    <a class="home-link" href="/">抽選ページと履歴に戻る</a>
    <section class="history" aria-labelledby="history-title">
      <h2 id="history-title">抽選履歴（advent.db）</h2>
      <div id="history-content" aria-live="polite">履歴を読み込んでいます...</div>
    </section>
  </main>
  <script>
    const boxes = [...document.querySelectorAll(".number-box")];
    const status = document.querySelector("#status");

    async function loadCard() {
      try {
        const response = await fetch("/api/card");
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);

        result.numbers.forEach((number, index) => {
          boxes[index].textContent = number;
          boxes[index].classList.remove("is-empty");
        });
        status.textContent = "このブラウザに割り当てられたカードです。";
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
      }
    }

    async function loadHistory() {
      const content = document.querySelector("#history-content");
      try {
        const response = await fetch("/api/history");
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);

        content.replaceChildren();
        if (result.history.length === 0) {
          const empty = document.createElement("p");
          empty.className = "history-empty";
          empty.textContent = "まだ抽選履歴はありません。";
          content.append(empty);
          return;
        }

        const drawnNumbers = new Set(result.history.map(({ number }) => number));
        boxes.forEach((box) => {
          if (drawnNumbers.has(Number(box.textContent))) box.classList.add("is-hit");
        });
        const list = document.createElement("ol");
        list.className = "history-list";
        result.history.forEach(({ number, drawn_at }) => {
          const item = document.createElement("li");
          item.textContent = `${number}（${drawn_at}）`;
          list.append(item);
        });
        content.append(list);
      } catch (error) {
        content.textContent = `履歴を取得できませんでした: ${error.message}`;
      }
    }

    loadCard().then(loadHistory);
  </script>
</body>
</html>
