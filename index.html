<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advent Number Draw</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20252b;
      --muted: #68717b;
      --paper: #f4efe7;
      --panel: #fffdf8;
      --line: #ddd4c8;
      --accent: #d85d43;
      --accent-dark: #a94232;
      --blue: #36788c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #fffdf7 0, var(--paper) 62%, #e7ddd0 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(900px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 48px 0;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-dark);
      font: 700 0.78rem/1.2 Arial, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.4rem, 7vw, 5rem);
      font-weight: 400;
      line-height: 0.95;
      text-align: center;
    }

    .description {
      margin: 0 0 42px;
      color: var(--muted);
      font: 0.95rem/1.6 Arial, sans-serif;
      text-align: center;
    }

    .number-stage {
      width: min(100%, 660px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .number-box {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 35px rgba(66, 48, 31, 0.1);
      color: var(--ink);
      font-size: clamp(4rem, 12vw, 8rem);
      line-height: 1;
    }

    .number-box.is-empty { color: #c8beb1; }

    .controls {
      width: min(100%, 660px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 24px;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font: 700 1rem Arial, sans-serif;
      transition: transform 160ms ease, filter 160ms ease;
    }

    button:hover { filter: brightness(1.06); transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:disabled { cursor: wait; filter: grayscale(0.35); opacity: 0.65; }
    #draw-once { grid-column: 1; background: var(--accent); }
    #draw-three { grid-column: 3; background: var(--blue); }

    .status {
      min-height: 24px;
      margin: 28px 0 0;
      color: var(--muted);
      font: 0.82rem/1.5 Arial, sans-serif;
      text-align: center;
    }

    .status.error { color: var(--accent-dark); }

    @media (max-width: 560px) {
      main { width: min(100% - 28px, 420px); padding: 32px 0; }
      .description { margin-bottom: 28px; }
      .number-stage, .controls { gap: 9px; }
      .number-box { border-radius: 5px; font-size: clamp(2.8rem, 17vw, 5rem); }
      button { min-height: 50px; font-size: 0.82rem; }
      .controls { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Advent Number Draw</p>
    <h1>数字をひく</h1>
    <p class="description">まだ出ていない数字を、1から20の中から選びます。</p>

    <section class="number-stage" aria-label="抽選結果">
      <div class="number-box is-empty" id="number-left">-</div>
      <div class="number-box is-empty" id="number-center">-</div>
      <div class="number-box is-empty" id="number-right">-</div>
    </section>

    <section class="controls" aria-label="抽選ボタン">
      <button id="draw-once" type="button">1回回す</button>
      <button id="draw-three" type="button">3回回す</button>
    </section>
    <p class="status" id="status" aria-live="polite">抽選回数を選んでください。</p>
  </main>

  <script>
    const boxes = [
      document.querySelector("#number-left"),
      document.querySelector("#number-center"),
      document.querySelector("#number-right"),
    ];
    const buttons = [...document.querySelectorAll("button")];
    const status = document.querySelector("#status");

    async function draw(count) {
      buttons.forEach((button) => { button.disabled = true; });
      status.className = "status";
      status.textContent = "抽選中...";

      try {
        const response = await fetch(`/api/draw?count=${count}`, { method: "POST" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);

        boxes.forEach((box) => {
          box.textContent = "-";
          box.classList.add("is-empty");
        });
        result.numbers.forEach((number, index) => {
          boxes[index].textContent = number;
          boxes[index].classList.remove("is-empty");
        });
        status.textContent = `${count}個の数字を記録しました。`;
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
      } finally {
        buttons.forEach((button) => { button.disabled = false; });
      }
    }

    document.querySelector("#draw-once").addEventListener("click", () => draw(1));
    document.querySelector("#draw-three").addEventListener("click", () => draw(3));
  </script>
</body>
</html>
