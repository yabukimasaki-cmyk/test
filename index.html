<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advent Number Draw</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20252b;
      --muted: #68717b;
      --paper: #f4efe7;
      --panel: #fffdf8;
      --line: #ddd4c8;
      --accent: #d85d43;
      --accent-dark: #a94232;
      --blue: #36788c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #fffdf7 0, var(--paper) 62%, #e7ddd0 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(900px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 48px 0;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-dark);
      font: 700 0.78rem/1.2 Arial, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.4rem, 7vw, 5rem);
      font-weight: 400;
      line-height: 0.95;
      text-align: center;
    }

    .description {
      margin: 0 0 42px;
      color: var(--muted);
      font: 0.95rem/1.6 Arial, sans-serif;
      text-align: center;
    }

    .card-link {
      margin: -20px 0 30px;
      color: var(--blue);
      font: 700 1rem Arial, sans-serif;
    }

    .number-stage {
      width: min(100%, 660px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .number-box {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 35px rgba(66, 48, 31, 0.1);
      color: var(--ink);
      font-size: clamp(4rem, 12vw, 8rem);
      line-height: 1;
    }

    .number-box.is-empty { color: #c8beb1; }
    .number-box.is-hit {
      border-color: var(--accent);
      background: #f9dfd6;
      color: var(--accent-dark);
    }

    .controls {
      width: min(100%, 660px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 24px;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font: 700 1rem Arial, sans-serif;
      transition: transform 160ms ease, filter 160ms ease;
    }

    button:hover { filter: brightness(1.06); transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:disabled { cursor: wait; filter: grayscale(0.35); opacity: 0.65; }
    #draw-once { background: var(--accent); }
    #reset-draws { background: #68717b; }
    #draw-three { background: var(--blue); }

    .status {
      min-height: 24px;
      margin: 28px 0 0;
      color: var(--muted);
      font: 0.82rem/1.5 Arial, sans-serif;
      text-align: center;
    }

    .status.error { color: var(--accent-dark); }

    .history {
      width: min(100%, 660px);
      margin-top: 20px;
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font: 0.9rem/1.6 Arial, sans-serif;
    }

    .history h2 { margin: 0 0 8px; font-size: 1rem; }
    .history-list { margin: 0; padding-left: 1.5rem; }
    .history-empty { margin: 0; color: var(--muted); }
    @media (max-width: 560px) {
      main { width: min(100% - 28px, 420px); padding: 32px 0; }
      .description { margin-bottom: 28px; }
      .number-stage, .controls { gap: 9px; }
      .number-box { border-radius: 5px; font-size: clamp(2.8rem, 17vw, 5rem); }
      button { min-height: 50px; font-size: 0.82rem; }
      .controls { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Advent Number Draw</p>
    <h1>数字をひく</h1>
    <p class="description">1から20の数字を抽選して、記録と履歴を確認できます。</p>
    <a class="card-link" href="/bingo">専用のビンゴカードを表示する</a>

    <section class="controls" aria-label="抽選ボタン">
      <button id="draw-once" type="button" disabled>1回回す</button>
      <button id="reset-draws" type="button" disabled>リセット</button>
      <button id="draw-three" type="button" disabled>3回回す</button>
    </section>
    <p class="status" id="status" aria-live="polite">抽選回数を選んでください。</p>
    <section class="history" aria-labelledby="history-title">
      <h2 id="history-title">抽選履歴</h2>
      <div id="history-content" aria-live="polite">履歴を読み込んでいます...</div>
    </section>
  </main>

  <script>
    const buttons = [...document.querySelectorAll("button")];
    const status = document.querySelector("#status");

    async function refreshHistory() {
      try {
        const response = await fetch("/api/history");
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);

        const content = document.querySelector("#history-content");
        content.replaceChildren();
        if (result.history.length === 0) {
          const empty = document.createElement("p");
          empty.className = "history-empty";
          empty.textContent = "まだ抽選履歴はありません。";
          content.append(empty);
          return;
        }

        const list = document.createElement("ol");
        list.className = "history-list";
        result.history.forEach(({ number, drawn_at }) => {
          const item = document.createElement("li");
          item.textContent = `${number}（${drawn_at}）`;
          list.append(item);
        });
        content.append(list);
      } catch (error) {
        document.querySelector("#history-content").textContent = `履歴を取得できませんでした: ${error.message}`;
      }
    }

    async function draw(count) {
      buttons.forEach((button) => { button.disabled = true; });
      status.className = "status";
      status.textContent = "抽選中...";

      try {
        const response = await fetch(`/api/draw?count=${count}`, { method: "POST" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);

        status.textContent = result.numbers.length
          ? `抽選結果: ${result.numbers.join("、")}`
          : "すべての数字を抽選済みです";
        await refreshHistory();
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
      } finally {
        buttons.forEach((button) => { button.disabled = false; });
      }
    }

    async function resetDraws() {
      if (!window.confirm("抽選履歴をすべて削除します。よろしいですか？")) return;

      buttons.forEach((button) => { button.disabled = true; });
      status.className = "status";
      status.textContent = "抽選結果をリセットしています...";

      try {
        const response = await fetch("/api/reset", {
          method: "POST",
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);

        status.textContent = "抽選結果をリセットしました。ビンゴカードは保持されます。";
        await refreshHistory();
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
      } finally {
        buttons.forEach((button) => { button.disabled = false; });
      }
    }

    document.querySelector("#draw-once").addEventListener("click", () => draw(1));
    document.querySelector("#draw-three").addEventListener("click", () => draw(3));
    document.querySelector("#reset-draws").addEventListener("click", resetDraws);
    refreshHistory().finally(() => buttons.forEach((button) => { button.disabled = false; }));
  </script>
</body>
</html>
